{% extends "admin/base_site.html" %}
{% block content %}
<p>The substitute coach will only be able to see this session, its student roster and its attendance,
  from 24 hours before the session until 24 hours after it ends.</p>
<form method="post">{% csrf_token %}
  <table>{{ form.as_table }}</table>
  <input type="submit" value="Assign substitute">
</form>
{% endblock %}
